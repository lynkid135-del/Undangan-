<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Undangan Digital Paket Komplit</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 1100px; margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
        
        .panel { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: #1e293b; }
        p.subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155; }
        input[type="text"], input[type="date"], input[type="time"], input[type="url"], select, textarea {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem;
        }
        input[type="file"] { font-size: 0.85rem; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-download {
            width: 100%; padding: 14px; background: #0f172a; color: #fff; border: none;
            border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px;
            transition: 0.2s;
        }
        .btn-download:hover { background: #334155; }
        
        /* Live Preview Frame */
        .preview-box {
            position: sticky; top: 20px; height: 650px; border: 8px solid #1e293b;
            border-radius: 28px; overflow: hidden; background: #fff;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- PANEL EDITOR (HANYA UNTUK PEMBUAT) -->
    <div class="panel">
        <span class="badge">MODE PEMBUAT (ADMIN)</span>
        <h1>Generator Undangan Digital</h1>
        <p class="subtitle">Atur desain, foto, dan lagu. Hasil download tidak bisa diubah oleh penerima.</p>

        <div class="form-group">
            <label>Pilih Tema & Motif (50 Variasi Desain)</label>
            <select id="themeSelect" onchange="updatePreview()"></select>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Nama Mempelai Pria</label>
                <input type="text" id="groomName" value="Rizky Pratama" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>Nama Mempelai Wanita</label>
                <input type="text" id="brideName" value="Aulia Putri" oninput="updatePreview()">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Tanggal Acara</label>
                <input type="date" id="eventDate" value="2026-12-20" onchange="updatePreview()">
            </div>
            <div class="form-group">
                <label>Waktu Acara</label>
                <input type="text" id="eventTime" value="09:00 WIB - Selesai" oninput="updatePreview()">
            </div>
        </div>

        <div class="form-group">
            <label>Alamat / Lokasi Acara</label>
            <textarea id="eventAddress" rows="2" oninput="updatePreview()">Gedung Serbaguna Kencana, Jl. Merdeka No. 45, Bandung</textarea>
        </div>

        <div class="form-group">
            <label>Link Google Maps</label>
            <input type="url" id="mapsLink" value="https://google.com" oninput="updatePreview()">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Nomor Rekening / E-Wallet</label>
                <input type="text" id="bankInfo" value="BCA - 1234567890 a/n Rizky Pratama" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>No. WhatsApp Konfirmasi RSVP</label>
                <input type="text" id="waNumber" value="6281234567890" placeholder="Contoh: 62812..." oninput="updatePreview()">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Upload Foto Sampul / Pasangan</label>
                <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">
            </div>
            <div class="form-group">
                <label>Upload Lagu Latar (.MP3)</label>
                <input type="file" id="audioInput" accept="audio/mp3,audio/*" onchange="handleAudio(event)">
            </div>
        </div>

        <button class="btn-download" onclick="downloadHTML()">⬇ Download Undangan (.HTML)</button>
    </div>

    <!-- PANEL LIVE PREVIEW -->
    <div>
        <div class="preview-box">
            <iframe id="previewFrame"></iframe>
        </div>
    </div>
</div>

<script>
    // Default media (Base64 / URL placeholder)
    let uploadedPhoto = "https://unsplash.com";
    let uploadedAudio = "";

    // Generate 50 Tema Bermotif (Kombinasi Palet Warna & Pola CSS SVG)
    const palettes = [
        { name: "Luxury Gold", bg: "#1c1917", card: "#292524", text: "#fafaf9", accent: "#d4af37" },
        { name: "Floral Pastel", bg: "#fff1f2", card: "#ffffff", text: "#4c0519", accent: "#e11d48" },
        { name: "Emerald Royal", bg: "#064e3b", card: "#065f46", text: "#ecfdf5", accent: "#fbbf24" },
        { name: "Classic Javanese", bg: "#451a03", card: "#78350f", text: "#fef3c7", accent: "#f59e0b" },
        { name: "Minimalist Sage", bg: "#f0fdf4", card: "#ffffff", text: "#14532d", accent: "#16a34a" },
        { name: "Ocean Navy", bg: "#0f172a", card: "#1e293b", text: "#f8fafc", accent: "#38bdf8" },
        { name: "Rustic Terracotta", bg: "#fff7ed", card: "#ffffff", text: "#7c2d12", accent: "#ea580c" },
        { name: "Lavender Dream", bg: "#faf5ff", card: "#ffffff", text: "#581c87", accent: "#9333ea" },
        { name: "Monochrome Modern", bg: "#f4f4f5", card: "#ffffff", text: "#18181b", accent: "#52525b" },
        { name: "Blush Peony", bg: "#fdf2f8", card: "#ffffff", text: "#831843", accent: "#db2777" }
    ];

    const patterns = [
        { name: "Motif Geometris", css: "radial-gradient(circle, currentColor 1px, transparent 1px); background-size: 20px 20px;" },
        { name: "Motif Garis Diagonal", css: "repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(128,128,128,0.08) 10px, rgba(128,128,128,0.08) 20px);" },
        { name: "Motif Batik Kawung", css: "radial-gradient(circle at 100% 50%, transparent 20%, rgba(128,128,128,0.07) 21%, rgba(128,128,128,0.07) 34%, transparent 35%, transparent), radial-gradient(circle at 0% 50%, transparent 20%, rgba(128,128,128,0.07) 21%, rgba(128,128,128,0.07) 34%, transparent 35%, transparent) 0 -50px; background-size: 40px 100px;" },
        { name: "Motif Anyaman Klasik", css: "linear-gradient(135deg, rgba(128,128,128,0.06) 25%, transparent 25%) -10px 0, linear-gradient(225deg, rgba(128,128,128,0.06) 25%, transparent 25%) -10px 0; background-size: 20px 20px;" },
        { name: "Motif Polos Elegan", css: "none;" }
    ];

    const themes = [];
    let count = 1;
    palettes.forEach(p => {
        patterns.forEach(pat => {
            themes.push({
                id: count,
                label: `Tema #${count}: ${p.name} - ${pat.name}`,
                ...p,
                pattern: pat.css
            });
            count++;
        });
    });

    // Isi dropdown 50 tema
    const selectEl = document.getElementById("themeSelect");
    themes.forEach((t, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = t.label;
        selectEl.appendChild(opt);
    });

    // Konversi Foto ke Base64 agar tertanam di file HTML
    function handlePhoto(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            uploadedPhoto = evt.target.result;
            updatePreview();
        };
        reader.readAsDataURL(file);
    }

    // Konversi Lagu MP3 ke Base64 agar tertanam di file HTML
    function handleAudio(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            uploadedAudio = evt.target.result;
            updatePreview();
        };
        reader.readAsDataURL(file);
    }

    // Fungsi Membangun Kode HTML Statis (Terkunci / Tanpa Editor)
    function generateStaticInvitationHTML() {
        const t = themes[document.getElementById("themeSelect").value];
        const groom = document.getElementById("groomName").value;
        const bride = document.getElementById("brideName").value;
        const date = document.getElementById("eventDate").value;
        const time = document.getElementById("eventTime").value;
        const address = document.getElementById("eventAddress").value;
        const maps = document.getElementById("mapsLink").value;
        const bank = document.getElementById("bankInfo").value;
        const wa = document.getElementById("waNumber").value;

        return `<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
